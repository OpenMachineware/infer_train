[package]
name = "infer_train"
version = "0.1.0"
edition = "2021"

[lib]
name = "_infer_train_torch"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.2", features = ["abi3-py38"], optional = true }
half = { version = "2.4", features = ["serde"] }
num-traits = "0.2"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
thiserror = "2.0"
rand = "0.8"
rand_distr = "0.4"
memmap2 = "0.9"
bytemuck = { version = "1.21", features = ["derive"] }
gguf-rs-lib = { version = "0.2.5", features = ["mmap", "std"] }
numpy = { version = "0.23", optional = true }
ndarray = "0.16"


[dev-dependencies]
criterion = "0.5"
rand = "0.8"
#infer_train = { path = "." }

[features]
extension-module = ["pyo3/extension-module"]
default = ["torch", "extension-module"]
torch = ["dep:pyo3", "dep:numpy"]
