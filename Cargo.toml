[package]
name = "infer_train"
version = "0.1.30"
edition = "2024"

[[bin]]
name = "infer_train"
path = "src/main.rs"

[[bin]]
name = "layer_compare"
path = "tools/layer_compare.rs"

[[bin]]
name = "op_compare"
path = "tools/op_compare.rs"

[[bin]]
name = "tokenize_compare"
path = "tools/tokenize_compare.rs"

[[bin]]
name = "op_test"
path = "tests/op_test/op_test.rs"

[[bin]]
name = "perf_compare"
path = "tools/perf_compare/src/main.rs"

[[bin]]
name = "op_profile"
path = "tools/op_profile/src/main.rs"

[[bin]]
name = "forward_profile"
path = "tools/forward_profile/src/main.rs"

[[bin]]
name = "vec_dot_bench"
path = "tests/vec_dot_bench.rs"

[features]
default = []
metal = []
cuda = []
rocm = []
debug-log = ["env_logger"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", optional = true }
half = { version = "2.4", features = ["num-traits"] }
log = { version = "0.4", features = ["release_max_level_off"] }
memmap2 = "0.9"
minijinja = "2.0"
once_cell = "1"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
once_cell = "1"

[[bin]]
name = "q5k_gemv_bench"
path = "tests/q5k_gemv_bench.rs"

[[bin]]
name = "warmup_test"
path = "tests/warmup_test.rs"

[[bin]]
name = "scoped_test"
path = "tests/scoped_test.rs"
