[package]
name = "infer_train"
version = "0.1.30"
edition = "2024"

[[bin]]
name = "infer_train"
path = "src/main.rs"

[[bin]]
name = "infer-train-bench"
path = "tools/bench.rs"

[features]
default = []
metal = []
cuda = []
rocm = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
half = "2.4"
bytemuck = { version = "1.18", features = ["derive"] }
num-traits = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
thiserror = "2.0"
log = "0.4"
once_cell = "1.20"
regex = "1.11"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
rayon = "1.10"
crossbeam = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
accelerate-src = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
num_cpus = "1.16"

[target.'cfg(target_arch = "aarch64")'.dependencies]
metal = "0.31"
objc = "0.2"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
