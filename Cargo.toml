[package]
name = "infer_train"
version = "0.1.30"
edition = "2024"

[[bin]]
name = "infer_train"
path = "src/main.rs"

[[bin]]
name = "layer_compare"
path = "tools/layer_compare.rs"

[[bin]]
name = "debug_single_layer"
path = "tools/debug_single_layer.rs"

[[bin]]
name = "list_tensors"
path = "tools/list_tensors.rs"

[[bin]]
name = "debug_q6k_scales"
path = "tools/debug_q6k_scales.rs"

[[bin]]
name = "op_compare"
path = "tools/op_compare.rs"

[[bin]]
name = "tokenize_compare"
path = "tools/tokenize_compare.rs"

[[bin]]
name = "op_test"
path = "tests/op_test/op_test.rs"

[[bin]]
name = "perf_compare"
path = "tools/perf_compare/src/main.rs"

[[bin]]
name = "op_profile"
path = "tools/op_profile/src/main.rs"

[[bin]]
name = "forward_profile"
path = "tools/forward_profile/src/main.rs"

[features]
default = []
metal = []
cuda = []
rocm = []
debug-log = ["env_logger"]
profile = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", optional = true }
half = { version = "2.4", features = ["num-traits"] }
log = { version = "0.4", features = ["release_max_level_off"] }
memmap2 = "0.9"
minijinja = "2.0"
once_cell = "1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
once_cell = "1"
rayon = "1.10"

# Unit tests

[[bin]]
name = "test_q6k_vecdot"
path = "tests/unit/test_q6k_vecdot.rs"

[[bin]]
name = "test_q5k_vecdot"
path = "tests/test_q5k_vecdot.rs"

[[bin]]
name = "verify_q5k"
path = "tests/verify_q5k.rs"


[[bin]]
name = "check_weights"
path = "tests/check_weights.rs"


[[bin]]
name = "check_q_weights"
path = "tests/check_q_weights.rs"


[[bin]]
name = "check_all_scales"
path = "tests/check_all_scales.rs"


[[bin]]
name = "verify_q6k_layout"
path = "tests/verify_q6k_layout.rs"


[[bin]]
name = "verify_q5k_layout"
path = "tests/verify_q5k_layout.rs"


[[bin]]
name = "verify_q4k_layout"
path = "tests/verify_q4k_layout.rs"


[[bin]]
name = "check_q6k_bytes"
path = "tests/check_q6k_bytes.rs"
