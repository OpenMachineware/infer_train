[package]
name = "infer_train"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
target-cpu = "native"
lto = "thin"
codegen-units = 1

[dependencies]
half = "2.4"
bytemuck = { version = "1.18", features = ["derive"] }
num-traits = "0.2"

[target.'cfg(target_arch = "aarch64")'.dependencies]
metal = "0.31"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "vec_dot_bench"
harness = false

[[bench]]
name = "vec_dot_neon_bench"
harness = false

[[bench]]
name = "vec_dot_gpu_bench"
harness = false

[[bench]]
name = "mv_gpu_bench"
harness = false

[[bench]]
name = "mv_q4_0_bench"
harness = false

[[bench]]
name = "mv_q4_k_bench"
harness = false

[[bench]]
name = "gpu_kernel_comparison"
harness = false

[features]
default = []
metal = []
