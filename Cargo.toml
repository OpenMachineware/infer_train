[package]
name = "infer_train"
version = "0.1.30"
edition = "2024"

[[bin]]
name = "infer_train"
path = "src/main.rs"

# TODO: 重写 benchmark 工具
# [[bin]]
# name = "infer-train-bench"
# path = "tools/bench.rs"

[features]
default = []
metal = []
cuda = []
rocm = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
half = { version = "2.4", features = ["num-traits"] }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
