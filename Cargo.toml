[package]
name = "infer_train"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inspect-gguf"
path = "tools/inspect_gguf.rs"

[[bin]]
name = "debug-tensor"
path = "tools/debug_tensor.rs"

[[bin]]
name = "inspect-tokenizer"
path = "tools/inspect_tokenizer.rs"

[[bin]]
name = "test-tokenizer"
path = "tools/test_tokenizer.rs"

[[bin]]
name = "bench-tokenizer"
path = "tools/bench_tokenizer.rs"

[[bin]]
name = "compare-tokenizer"
path = "tools/compare_tokenizer.rs"

[[bin]]
name = "debug-pre-tokenize"
path = "tools/debug_pre_tokenize.rs"

[[bin]]
name = "debug-bpe"
path = "tools/debug_bpe.rs"

[[bin]]
name = "trace-bpe"
path = "tools/trace_bpe.rs"

[[bin]]
name = "trace-sequence"
path = "tools/trace_sequence.rs"

[features]
default = []
metal = []

[profile.release]
opt-level = 3
target-cpu = "native"
lto = "thin"
codegen-units = 1

[dependencies]
half = "2.4"
bytemuck = { version = "1.18", features = ["derive"] }
num-traits = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
thiserror = "2.0"
log = "0.4"
once_cell = "1.20"
regex = "1.11"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
num_cpus = "1.16"

[target.'cfg(target_arch = "aarch64")'.dependencies]
metal = "0.31"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "vec_dot_bench"
harness = false

[[bench]]
name = "vec_dot_neon_bench"
harness = false

[[bench]]
name = "vec_dot_gpu_bench"
harness = false

[[bench]]
name = "mv_gpu_bench"
harness = false

[[bench]]
name = "mv_q4_0_bench"
harness = false

[[bench]]
name = "mv_q4_k_bench"
harness = false

[[bench]]
name = "gpu_kernel_comparison"
harness = false

[[bench]]
name = "bench_all_flash_decode_formats"
harness = false

[[bench]]
name = "bench_flash_decode_stages"
harness = false

[[bench]]
name = "kv_cache_bench"
harness = false

[[bench]]
name = "tokenizer_bench"
harness = false
