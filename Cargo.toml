[features]
default = []
metal = []
cuda = []
rocm = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
half = "2.4"
bytemuck = { version = "1.18", features = ["derive"] }
num-traits = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
thiserror = "2.0"
log = "0.4"
once_cell = "1.20"
regex = "1.11"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
num_cpus = "1.16"

[target.'cfg(target_arch = "aarch64")'.dependencies]
metal = "0.31"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

