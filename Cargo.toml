[package]
name = "infer_train"
version = "0.1.30"
edition = "2024"

[[bin]]
name = "infer_train"
path = "src/main.rs"

[[bin]]
name = "test_tokenizer"
path = "tools/test_tokenizer.rs"

[[bin]]
name = "test_chat_template"
path = "tools/test_chat_template.rs"

# TODO: rewrite benchmark tool
# [[bin]]
# name = "infer-train-bench"
# path = "tools/bench.rs"

[features]
default = []
metal = []
cuda = []
rocm = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
clap = { version = "4", features = ["derive"] }
half = { version = "2.4", features = ["num-traits"] }
minijinja = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
