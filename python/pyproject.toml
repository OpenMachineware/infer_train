[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "infer_train"
version = "0.2.0"
description = "infer_train - high-performance LLM inference engine (Mojo) with a torch.compile backend"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jia Liu", email = "proljc@gmail.com" }]
dependencies = ["torch>=2.0"]

[tool.setuptools]
package-dir = { "" = "." }
packages = ["infer_train"]

[tool.setuptools.package-data]
infer_train = ["_lib/*"]
