[workspace]
authors = ["Jia Liu <proljc@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "infer_train"
platforms = ["osx-arm64"]
version = "0.2.1"

[tasks]
# Generate src/version.mojo from the `version` field of this file.
version = "python tools/gen_version.py"
# Build the CLI binary (generates src/version.mojo first, then `make cli`).
build = "version && make cli"

[dependencies]
mojo = ">=1.0.0,<2"
python = "==3.13"
pytorch = ">=2.13.0,<3"
pytest = ">=9.1.1,<10"
pip = ">=26.2.1,<27"
max = ">=26.5.0,<27"
